  <rect width="640" height="400" rx="24" fill="#f7f9fc"/>
  <text x="40" y="54" fill="#132238" font-family="Arial, sans-serif" font-size="25" font-weight="700">Zero-Shot Domain Adaptation</text>
  <text x="40" y="84" fill="#5b6b80" font-family="Arial, sans-serif" font-size="15">Workflow figure placeholder</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="38" y="146" width="136" height="112" rx="16" fill="#e8f0ff" stroke="#8ca9dc" stroke-width="2"/>
